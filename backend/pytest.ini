[pytest]
testpaths = tests

# Puts backend/ on sys.path so `from app import ...` resolves.
#
# `python -m pytest` adds the CWD to sys.path and bare `pytest` does not, so
# without this the suite passes when a developer runs the former and fails on
# collection when CI runs the latter. That is exactly how it first broke:
# ModuleNotFoundError: No module named 'app', green locally, red on the runner.
# Fixing it here rather than in the workflow means either invocation works.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
